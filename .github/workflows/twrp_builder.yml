name: Build TWRP for Samsung Galaxy A36 (a36xq)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    env:
      DEVICE_NAME: a36xq
      DEVICE_PATH: device/samsung/a36xq
      DEVICE_TREE: https://github.com/DevCat3/android_device_samsung_a36xq
      DEVICE_BRANCH: android-12.1
      MANIFEST_BRANCH: twrp-12.1

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup runner
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
        libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Setup Java 11
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 11

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Init TWRP manifest
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $MANIFEST_BRANCH

    - name: Repo sync
      run: |
        cd workspace
        repo sync -c --prune -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree
      run: |
        cd workspace
        git clone $DEVICE_TREE -b $DEVICE_BRANCH $DEVICE_PATH

    - name: Enable ccache
      run: |
        export USE_CCACHE=1
        ccache -M 20G

    - name: Set swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Build TWRP vendor_boot image
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export BOARD_USES_VENDOR_BOOTIMAGE=true
        export BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE=134217728
        lunch twrp_${DEVICE_NAME}-eng
        mka vendorbootimage -j$(nproc --all)
   
    - name: Verify vendor_boot.img exists
      run: |
        cd workspace/out/target/product/${DEVICE_NAME}

        if [ ! -f vendor_boot.img ]; then
          echo "vendor_boot.img not found"
          exit 1
        fi

        echo "vendor_boot.img built successfully"
        echo "MD5=$(md5sum vendor_boot.img | cut -d ' ' -f1)" >> $GITHUB_ENV
   
    - name: Create Odin TAR
      run: |
        cd workspace/out/target/product/${DEVICE_NAME}
        tar -H ustar -cvf vendor_boot.tar vendor_boot.img

    - name: Create Flashable ZIP
      run: |
        cd workspace/out/target/product/${DEVICE_NAME}
        zip -r vendor_boot.zip vendor_boot.img

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/a36xq/vendor_boot.img
          workspace/out/target/product/a36xq/vendor_boot.tar
          workspace/out/target/product/a36xq/vendor_boot.zip
        name: "TWRP a36xq - ${{ github.run_id }}"
        tag_name: "a36xq-${{ github.run_id }}"
        body: |
          🔥 Samsung Galaxy A36 TWRP Build

          Device: a36xq  
          Target: vendor_boot (TWRP in boot)  
          Branch: twrp-12.1  

          MD5:
          ${{ env.MD5 }}

          Flash Methods:
          Odin → AP → vendor_boot.tar  
          Fastboot → fastboot flash vendor_boot vendor_boot.img  
          Recovery → vendor_boot.zip
